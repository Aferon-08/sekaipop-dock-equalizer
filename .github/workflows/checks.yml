name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q .
      - name: Manifest
        run: python -c "import json; p=json.load(open('plugin.json')); assert p['id']=='dock-equalizer' and p['api']==1"
      - name: Worker bundle
        run: python build-pet-worker.py --check
      - name: Tube, independent twins and reunion
        run: node tests/tube-and-family.mjs
      - name: Independent bubble carriers and plastic wall
        run: node tests/bubble-family.mjs
